# Publishing settings for the ZionOS package repository and ISO downloads.
# Sourced by scripts/publish.sh. No secrets belong in this file.
# The SSH login used for uploads is private to the release manager: put
#   ZIONOS_REPO_SSH="user@host"
# in release.local.conf (not tracked by git) or in the environment.
ZIONOS_REPO_DIR="/srv/zionos"                    # on the server: repo/ and iso/ live here
ZIONOS_REPO_URL="https://freedomnet.tech/zionos" # what installed systems use
ZIONOS_ISO_URL="https://freedomnet.tech/iso"
ZIONOS_SUITE="aleph"
