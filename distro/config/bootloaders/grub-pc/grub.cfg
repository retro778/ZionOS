source /boot/grub/config.cfg

set timeout=10

menuentry "ZionOS Live (English)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us,il
	initrd	@INITRD_LIVE@
}
menuentry "ZionOS Live (Hebrew)" --hotkey=h {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=he_IL.UTF-8 keyboard-layouts=us,il
	initrd	@INITRD_LIVE@
}
menuentry "ZionOS Live (safe graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us,il nomodeset
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
